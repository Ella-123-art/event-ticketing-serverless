name: Deploy Lambda Functions

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Zip and deploy listEvents
        run: |
          cd src/listEvents
          zip -r ../../listEvents.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name listEvents \
            --zip-file fileb://listEvents.zip

      - name: Zip and deploy registerForEvent
        run: |
          cd src/registerForEvent
          zip -r ../../registerForEvent.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name registerForEvent \
            --zip-file fileb://registerForEvent.zip